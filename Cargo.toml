[package]
name = "oramacore_ptrie"
version = "0.1.0"
description = """Generic trie data structure implementation (prefix tree) with support for different key and value types,
and functions to search for common prefixes or postfixes."""
keywords = ["trie", "data-structures", "generic", "prefix-tree"]
categories = ["data-structures"]
homepage = "https://github.com/oramacore/oramacore_ptrie"
repository = "https://github.com/vemonet/oramacore_ptrie.git"
readme = "README.md"
license-file = "LICENSE"

edition = "2021"


[dependencies]
serde = { version = "1.0", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
criterion = "0.5"


[features]
serde = ["dep:serde"]

[profile.release]
lto = true


[[bench]]
name = "criterion_benchmark"
harness = false
